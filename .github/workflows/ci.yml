name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  DOTNET_VERSION: '8.0.x'

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    name: Frontend Tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: hirethemnow.client/package-lock.json

    - name: Install dependencies
      run: |
        cd hirethemnow.client
        npm ci

    - name: Run ESLint
      run: |
        cd hirethemnow.client
        npm run lint

    - name: Run TypeScript check
      run: |
        cd hirethemnow.client
        npm run type-check

    - name: Build frontend
      run: |
        cd hirethemnow.client
        npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: frontend-build
        path: hirethemnow.client/dist/
        retention-days: 1

  backend-test:
    runs-on: ubuntu-latest
    name: Backend Tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: |
        cd HireThemNoW.Server
        dotnet restore

    - name: Build backend
      run: |
        cd HireThemNoW.Server
        dotnet build --configuration Release --no-restore

    - name: Run tests (if any)
      run: |
        cd HireThemNoW.Server
        # Add test command here when tests are available
        # dotnet test --configuration Release --no-build --verbosity normal
        echo "No tests configured yet"

    - name: Publish backend
      run: |
        cd HireThemNoW.Server
        dotnet publish -c Release -r linux-x64 --self-contained false -o ./publish

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    # Allow this job to fail without blocking other jobs
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        # Remove SARIF upload for now to avoid permission issues

    - name: Run npm audit (if package.json exists)
      run: |
        if [ -f "hirethemnow.client/package.json" ]; then
          cd hirethemnow.client
          npm audit --audit-level=high || echo "npm audit found issues"
        fi

  validate-infrastructure:
    runs-on: ubuntu-latest
    name: Validate AWS Infrastructure
    # Allow this job to fail without blocking other jobs
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check if CloudFormation template exists
      id: check-template
      run: |
        if [ -f "aws-deployment/cloudformation-template.yaml" ]; then
          echo "template_exists=true" >> $GITHUB_OUTPUT
        else
          echo "template_exists=false" >> $GITHUB_OUTPUT
          echo "CloudFormation template not found, skipping validation"
        fi

    - name: Configure AWS credentials
      if: steps.check-template.outputs.template_exists == 'true' && github.repository_owner != 'fork'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Validate CloudFormation template
      if: steps.check-template.outputs.template_exists == 'true' && github.repository_owner != 'fork'
      run: |
        aws cloudformation validate-template \
          --template-body file://aws-deployment/cloudformation-template.yaml

    - name: Install cfn-lint
      if: steps.check-template.outputs.template_exists == 'true'
      run: pip install cfn-lint

    - name: Lint CloudFormation template
      if: steps.check-template.outputs.template_exists == 'true'
      run: |
        cfn-lint aws-deployment/cloudformation-template.yaml || echo "CloudFormation linting completed with warnings"

  summary:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, security-scan, validate-infrastructure]
    if: always()
    name: CI Summary

    steps:
    - name: Check all jobs status
      run: |
        echo "=== CI Pipeline Results ==="
        echo "Frontend Tests: ${{ needs.frontend-test.result }}"
        echo "Backend Tests: ${{ needs.backend-test.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Infrastructure: ${{ needs.validate-infrastructure.result }}"
        echo ""

        # Only fail if critical jobs fail
        if [[ "${{ needs.frontend-test.result }}" != "success" ]]; then
          echo "❌ Frontend tests failed - this is blocking"
          exit 1
        fi
        if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
          echo "❌ Backend tests failed - this is blocking"
          exit 1
        fi

        # Security and infrastructure are non-blocking
        if [[ "${{ needs.security-scan.result }}" != "success" ]]; then
          echo "⚠️ Security scan had issues (non-blocking)"
        fi
        if [[ "${{ needs.validate-infrastructure.result }}" != "success" ]]; then
          echo "⚠️ Infrastructure validation had issues (non-blocking)"
        fi

        echo "✅ Critical CI checks passed!"

    - name: Comment on PR
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const frontendStatus = '${{ needs.frontend-test.result }}';
          const backendStatus = '${{ needs.backend-test.result }}';
          const securityStatus = '${{ needs.security-scan.result }}';
          const infraStatus = '${{ needs.validate-infrastructure.result }}';

          const allPassed = frontendStatus === 'success' &&
                           backendStatus === 'success' &&
                           infraStatus === 'success';
          const status = allPassed ? '✅' : '❌';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `${status} **CI Pipeline Results**

            - Frontend Tests: ${frontendStatus === 'success' ? '✅' : '❌'}
            - Backend Tests: ${backendStatus === 'success' ? '✅' : '❌'}
            - Security Scan: ${securityStatus === 'success' ? '✅' : '⚠️'}
            - Infrastructure: ${infraStatus === 'success' ? '✅' : '❌'}

            ${allPassed ? 'Ready for deployment! 🚀' : 'Please fix the issues above before merging.'}`
          })