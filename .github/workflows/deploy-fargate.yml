name: Deploy to AWS Fargate (Production)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  STACK_NAME: hirethemnow-fargate-prod
  AI_STACK_NAME: hirethemnow-ai-agent
  NODE_VERSION: '20'
  DOTNET_VERSION: '8.0.x'

jobs:
  # New job: Deploy AI Agent Lambda Functions
  deploy-ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Check if AI Agent stack exists
      id: check-stack
      continue-on-error: true
      run: |
        if aws cloudformation describe-stacks \
          --stack-name ${{ env.AI_STACK_NAME }} \
          --region ${{ env.AWS_REGION }} &>/dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ AI Agent stack exists - will update"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "📦 AI Agent stack does not exist - will create it"
        fi

    - name: Package Lambda functions
      run: |
        echo "📦 Packaging Lambda function..."

        cd aws-infrastructure/lambda-functions/resume-processor
        npm ci --production
        zip -rq resume-processor.zip index.js node_modules package.json package-lock.json

        echo "✅ Lambda function packaged"

    - name: Upload Lambda to S3
      run: |
        echo "📤 Uploading Lambda function to S3..."

        # Create or use existing S3 bucket for Lambda code
        LAMBDA_BUCKET="${{ env.AI_STACK_NAME }}-lambda-code"

        if ! aws s3 ls "s3://${LAMBDA_BUCKET}" 2>&1 | grep -q 'NoSuchBucket'; then
          echo "✅ S3 bucket exists: ${LAMBDA_BUCKET}"
        else
          echo "📦 Creating S3 bucket: ${LAMBDA_BUCKET}"
          aws s3 mb "s3://${LAMBDA_BUCKET}" --region ${{ env.AWS_REGION }}
        fi

        # Upload Lambda package
        aws s3 cp aws-infrastructure/lambda-functions/resume-processor/resume-processor.zip \
          "s3://${LAMBDA_BUCKET}/resume-processor.zip"

        echo "✅ Lambda code uploaded to S3"

    - name: Deploy AI Agent CloudFormation Stack
      run: |
        echo "🏗️ Deploying AI Agent infrastructure..."

        # Get database endpoint from main stack
        DB_ENDPOINT=$(aws cloudformation describe-stacks \
          --stack-name hirethemnow-fargate-prod \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" \
          --output text 2>/dev/null || echo "localhost:5432")

        # Get VPC configuration from main stack
        VPC_ID=$(aws cloudformation describe-stacks \
          --stack-name hirethemnow-fargate-prod \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" \
          --output text 2>/dev/null || echo "")

        SUBNET_IDS=$(aws cloudformation describe-stacks \
          --stack-name hirethemnow-fargate-prod \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetIds'].OutputValue" \
          --output text 2>/dev/null || echo "")

        RDS_SG_ID=$(aws cloudformation describe-stacks \
          --stack-name hirethemnow-fargate-prod \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs[?OutputKey=='DatabaseSecurityGroup'].OutputValue" \
          --output text 2>/dev/null || echo "")

        # If VPC info not in outputs, get from RDS directly
        if [ -z "$VPC_ID" ] || [ -z "$SUBNET_IDS" ] || [ -z "$RDS_SG_ID" ]; then
          echo "⚠️ VPC info not in stack outputs, fetching from RDS..."

          VPC_ID=$(aws rds describe-db-instances \
            --db-instance-identifier hirethemnow-fargate-prod-postgres \
            --region ${{ env.AWS_REGION }} \
            --query "DBInstances[0].DBSubnetGroup.VpcId" \
            --output text 2>/dev/null || echo "vpc-08ab0cef55d004211")

          SUBNET_IDS=$(aws rds describe-db-instances \
            --db-instance-identifier hirethemnow-fargate-prod-postgres \
            --region ${{ env.AWS_REGION }} \
            --query "DBInstances[0].DBSubnetGroup.Subnets[*].SubnetIdentifier" \
            --output text 2>/dev/null | tr '\t' ',' || echo "subnet-0563fa7bae3d5fa2c,subnet-0d212a3b5e91a41ea")

          RDS_SG_ID=$(aws rds describe-db-instances \
            --db-instance-identifier hirethemnow-fargate-prod-postgres \
            --region ${{ env.AWS_REGION }} \
            --query "DBInstances[0].VpcSecurityGroups[0].VpcSecurityGroupId" \
            --output text 2>/dev/null || echo "sg-0c2721db36b221307")
        fi

        echo "📋 VPC Configuration:"
        echo "  VPC ID: ${VPC_ID}"
        echo "  Subnets: ${SUBNET_IDS}"
        echo "  RDS SG: ${RDS_SG_ID}"

        aws cloudformation deploy \
          --template-file aws-infrastructure/cloudformation-template.yaml \
          --stack-name ${{ env.AI_STACK_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --parameter-overrides \
            DatabaseHost="${DB_ENDPOINT}" \
            DatabasePassword="${{ secrets.DATABASE_PASSWORD }}" \
            ApiBaseUrl="https://api.hirethemnow.xyz" \
            VpcId="${VPC_ID}" \
            SubnetIds="${SUBNET_IDS}" \
            RdsSecurityGroupId="${RDS_SG_ID}" \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
          --no-fail-on-empty-changeset

        echo "✅ AI Agent CloudFormation stack deployed"

    - name: Update Lambda function
      run: |
        echo "🔄 Updating Lambda function code..."

        LAMBDA_BUCKET="${{ env.AI_STACK_NAME }}-lambda-code"

        # Update the Lambda function (created by CloudFormation)
        aws lambda update-function-code \
          --function-name "${{ env.AI_STACK_NAME }}-ResumeProcessor" \
          --s3-bucket "${LAMBDA_BUCKET}" \
          --s3-key "resume-processor.zip" \
          --region ${{ env.AWS_REGION }}

        echo "✅ Lambda function updated"

    - name: AI Agent deployment summary
      run: |
        echo ""
        echo "🤖 AI Agent Lambda Deployment Complete!"
        echo "========================================"
        echo ""
        echo "✅ Lambda function updated: ${{ env.AI_STACK_NAME }}-ResumeProcessor"
        echo "🎯 Function: Resume ATS Scoring"
        echo "💰 Cost: ~$0.20 per resume analyzed"
        echo ""

  # Existing deployment job
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: deploy-ai-agent  # Wait for AI agent deployment first

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: hirethemnow.client/package-lock.json

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy Fargate Infrastructure
      id: deploy-infrastructure
      run: |
        echo "🏗️ Deploying cost-effective Fargate infrastructure..."
        aws cloudformation deploy \
          --template-file aws-deployment/fargate-template.yaml \
          --stack-name ${{ env.STACK_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --parameter-overrides \
            Environment=prod \
            JWTSecret="${{ secrets.JWT_SECRET }}" \
            GoogleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GoogleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            DatabasePassword="${{ secrets.DATABASE_PASSWORD }}" \
            DomainName="hirethemnow.xyz" \
            CertificateArn="arn:aws:acm:us-east-1:259733483969:certificate/9e129f76-2637-4d75-a2b0-808f2cbc3a35" \
          --capabilities CAPABILITY_IAM \
          --no-fail-on-empty-changeset

    - name: Get stack outputs
      id: stack-outputs
      run: |
        echo "📋 Getting CloudFormation outputs..."
        OUTPUTS=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --query "Stacks[0].Outputs" --output json)

        FRONTEND_BUCKET=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="S3FrontendBucket") | .OutputValue')
        API_URL=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ApiURL") | .OutputValue')
        FRONTEND_URL=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="FrontendURL") | .OutputValue')
        ECR_REPOSITORY=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ECRRepository") | .OutputValue')
        DATABASE_ENDPOINT=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="DatabaseEndpoint") | .OutputValue')

        echo "frontend-bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
        echo "api-url=$API_URL" >> $GITHUB_OUTPUT
        echo "frontend-url=$FRONTEND_URL" >> $GITHUB_OUTPUT
        echo "ecr-repository=$ECR_REPOSITORY" >> $GITHUB_OUTPUT
        echo "database-endpoint=$DATABASE_ENDPOINT" >> $GITHUB_OUTPUT

        echo "✅ Infrastructure Outputs:"
        echo "  Frontend Bucket: $FRONTEND_BUCKET"
        echo "  API URL: $API_URL"
        echo "  Frontend URL: $FRONTEND_URL"
        echo "  ECR Repository: $ECR_REPOSITORY"
        echo "  Database Endpoint: $DATABASE_ENDPOINT"

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      id: build-image
      run: |
        echo "🐳 Building Docker image..."

        # Build the Docker image
        docker build -t hirethemnow-api .

        # Tag the image with ECR repository URL
        ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY_URI=${{ steps.stack-outputs.outputs.ecr-repository }}
        IMAGE_TAG=latest

        echo "📦 Tagging image: $ECR_REPOSITORY_URI:$IMAGE_TAG"
        docker tag hirethemnow-api:latest $ECR_REPOSITORY_URI:$IMAGE_TAG

        echo "📤 Pushing image to ECR..."
        docker push $ECR_REPOSITORY_URI:$IMAGE_TAG

        echo "✅ Docker image pushed successfully"
        echo "image-uri=$ECR_REPOSITORY_URI:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Skip database migrations (will run in container)
      id: database-migration
      run: |
        echo "🗄️ Skipping database migrations - will run automatically in container startup"
        echo "Database Host: ${{ steps.stack-outputs.outputs.database-endpoint }}"
        echo "✅ Migration will be handled by container startup script"

    - name: Update ECS service
      id: update-service
      run: |
        echo "🔄 Updating ECS service with new image..."

        aws ecs update-service \
          --cluster "${{ env.STACK_NAME }}-cluster" \
          --service "${{ env.STACK_NAME }}-service" \
          --force-new-deployment \
          --region ${{ env.AWS_REGION }}

        echo "✅ ECS service update initiated"

    - name: Wait for service deployment
      id: wait-deployment
      timeout-minutes: 20
      run: |
        echo "⏳ Waiting for ECS service to be stable..."

        # Check service status before waiting
        echo "📊 Current service status:"
        aws ecs describe-services \
          --cluster "${{ env.STACK_NAME }}-cluster" \
          --services "${{ env.STACK_NAME }}-service" \
          --region ${{ env.AWS_REGION }} \
          --query 'services[0].{Status:status,DesiredCount:desiredCount,RunningCount:runningCount,PendingCount:pendingCount}' \
          --output table

        # Wait with timeout handling
        if aws ecs wait services-stable \
          --cluster "${{ env.STACK_NAME }}-cluster" \
          --services "${{ env.STACK_NAME }}-service" \
          --region ${{ env.AWS_REGION }}; then
          echo "✅ ECS service is now stable"
        else
          echo "⚠️ Service stabilization timed out. Checking service details..."

          # Get detailed failure information
          echo "🔍 Service events (last 10):"
          aws ecs describe-services \
            --cluster "${{ env.STACK_NAME }}-cluster" \
            --services "${{ env.STACK_NAME }}-service" \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].events[:10]' \
            --output table

          echo "🔍 Task failures:"
          TASK_ARNS=$(aws ecs list-tasks \
            --cluster "${{ env.STACK_NAME }}-cluster" \
            --service-name "${{ env.STACK_NAME }}-service" \
            --region ${{ env.AWS_REGION }} \
            --query 'taskArns[0]' \
            --output text)

          if [ ! -z "$TASK_ARNS" ]; then
            aws ecs describe-tasks \
              --cluster "${{ env.STACK_NAME }}-cluster" \
              --tasks $TASK_ARNS \
              --region ${{ env.AWS_REGION }} \
              --query 'tasks[0].{LastStatus:lastStatus,StopReason:stoppedReason,Containers:containers[*].{Name:name,Status:lastStatus,Reason:reason}}' \
              --output json
          fi

          exit 1
        fi

    - name: Install frontend dependencies
      run: |
        echo "📦 Installing frontend dependencies..."
        cd hirethemnow.client
        npm ci

    - name: Create production environment file
      run: |
        echo "🔧 Creating production environment configuration..."
        cd hirethemnow.client
        cat > .env.production << EOF
        VITE_APP_ENV=production
        VITE_API_URL=https://api.hirethemnow.xyz/api
        VITE_APP_NAME=HireThemNow
        VITE_BACKEND_URL=https://api.hirethemnow.xyz
        VITE_API_BASE_URL=https://api.hirethemnow.xyz/api
        VITE_ENABLE_DEBUG=false
        VITE_ENABLE_MOCK_DATA=false
        VITE_LOG_LEVEL=error
        VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
        EOF

        echo "✅ Environment file created:"
        cat .env.production

    - name: Build frontend for production
      run: |
        echo "🔨 Building React frontend..."
        cd hirethemnow.client
        npm run build:production

    - name: Deploy frontend to S3
      run: |
        echo "📤 Deploying frontend to S3..."

        # Deploy static assets with long cache
        aws s3 sync hirethemnow.client/dist/ s3://${{ steps.stack-outputs.outputs.frontend-bucket }} \
          --delete \
          --cache-control "public,max-age=31536000,immutable" \
          --exclude "*.html" \
          --region ${{ env.AWS_REGION }}

        # Deploy HTML files with short cache
        aws s3 sync hirethemnow.client/dist/ s3://${{ steps.stack-outputs.outputs.frontend-bucket }} \
          --delete \
          --cache-control "public,max-age=0,must-revalidate" \
          --include "*.html" \
          --region ${{ env.AWS_REGION }}

        echo "✅ Frontend deployed to S3"

    - name: Test API health
      id: test-api
      run: |
        echo "🧪 Testing API health..."

        # Wait a bit for ALB to be ready
        sleep 30

        API_URL="${{ steps.stack-outputs.outputs.api-url }}"

        # Test health endpoint
        HEALTH_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/health_response.json "$API_URL/api/health" || echo "000")

        if [ "$HEALTH_RESPONSE" = "200" ]; then
          echo "✅ API health check passed"
          echo "Response: $(cat /tmp/health_response.json)"
        else
          echo "⚠️ API health check failed with status: $HEALTH_RESPONSE"
          echo "Response: $(cat /tmp/health_response.json 2>/dev/null || echo 'No response')"
        fi

    - name: Invalidate CloudFront cache
      run: |
        echo "🔄 Invalidating CloudFront cache..."

        # Get CloudFront distribution ID from the domain
        FRONTEND_URL="${{ steps.stack-outputs.outputs.frontend-url }}"
        DISTRIBUTION_DOMAIN=$(echo "$FRONTEND_URL" | sed 's|https://||')

        CLOUDFRONT_ID=$(aws cloudfront list-distributions \
          --query "DistributionList.Items[?DomainName=='$DISTRIBUTION_DOMAIN'].Id" \
          --output text 2>/dev/null || echo "")

        if [ ! -z "$CLOUDFRONT_ID" ] && [ "$CLOUDFRONT_ID" != "None" ]; then
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_ID \
            --paths "/*" \
            --region ${{ env.AWS_REGION }}
          echo "✅ CloudFront cache invalidated for distribution: $CLOUDFRONT_ID"
        else
          echo "⚠️ CloudFront distribution not found, skipping cache invalidation"
        fi

    - name: Deployment summary
      run: |
        echo ""
        echo "🎉 Fargate Deployment Completed Successfully!"
        echo "================================================"
        echo ""
        echo "🌐 Frontend URL: ${{ steps.stack-outputs.outputs.frontend-url }}"
        echo "🔗 API URL: ${{ steps.stack-outputs.outputs.api-url }}"
        echo "📦 Stack Name: ${{ env.STACK_NAME }}"
        echo "🌍 Region: ${{ env.AWS_REGION }}"
        echo "💰 Estimated Cost: ~$15-25/month (75% savings vs Lambda/RDS)"
        echo ""
        echo "✅ What's deployed:"
        echo "   • Fargate container (512 CPU, 1GB RAM)"
        echo "   • Application Load Balancer"
        echo "   • CloudFront + S3 for frontend"
        echo "   • ECR repository for Docker images"
        echo "   • AI Agent Lambda (if configured)"
        echo "   • No expensive RDS or NAT Gateway!"

    - name: Comment on PR (if applicable)
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **Fargate Deployment Complete!**

            ✅ Frontend: ${{ steps.stack-outputs.outputs.frontend-url }}
            ✅ API: ${{ steps.stack-outputs.outputs.api-url }}
            💰 Cost: ~$15-25/month (75% savings!)

            **What's New:**
            • Containerized deployment on AWS Fargate
            • No cold starts, better performance
            • Massive cost reduction vs Lambda/RDS
            • Identical local/production environment
            • AI-powered resume analysis (if configured)

            The application has been successfully deployed to production.`
          })

  notify-failure:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
    - name: Notify deployment failure
      run: |
        echo "❌ Fargate deployment failed!"
        echo "Check the logs above for details."
        echo ""
        echo "Common issues:"
        echo "• Docker build failure - check Dockerfile"
        echo "• AWS permissions - check IAM roles"
        echo "• Resource limits - check AWS quotas"
        exit 1
