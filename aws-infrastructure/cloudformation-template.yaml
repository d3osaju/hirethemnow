AWSTemplateFormatVersion: '2010-09-09'
Description: 'HireThemNow AI Resume Analysis Infrastructure (Simplified - ATS Only)'

Parameters:
  DatabaseHost:
    Type: String
    Description: 'PostgreSQL Database Host'

  DatabasePassword:
    Type: String
    NoEcho: true
    Description: 'Database Password'

  ApiBaseUrl:
    Type: String
    Description: 'Base URL for your .NET API (e.g., https://api.hirethemnow.xyz)'

Resources:
  # S3 Bucket for Resume Storage
  ResumeStorageBucket:
    Type: AWS::S3::Bucket
    DependsOn: ResumeProcessorS3Permission
    Properties:
      BucketName: !Sub '${AWS::StackName}-resumes'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ResumeProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .pdf
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ResumeProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .docx
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedHeaders:
              - '*'

  # IAM Role for Lambda Function
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-LambdaExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: LambdaS3BedrockPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource: !Sub 'arn:aws:s3:::${AWS::StackName}-resumes/*'
              - Effect: Allow
                Action:
                  - 'bedrock:InvokeModel'
                  - 'bedrock:InvokeModelWithResponseStream'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'textract:AnalyzeDocument'
                  - 'textract:DetectDocumentText'
                Resource: '*'

  # Lambda Function for Resume Processing
  ResumeProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ResumeProcessor'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          DATABASE_HOST: !Ref DatabaseHost
          DATABASE_PASSWORD: !Ref DatabasePassword
          API_BASE_URL: !Ref ApiBaseUrl
          RESUME_BUCKET: !Ref ResumeStorageBucket
      Code:
        S3Bucket: !Sub '${AWS::StackName}-lambda-code'
        S3Key: 'resume-processor.zip'

  # Permission for S3 to invoke Lambda
  ResumeProcessorS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ResumeProcessorFunction.Arn
      Action: 'lambda:InvokeFunction'
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${AWS::StackName}-resumes'

Outputs:
  ResumeBucketName:
    Description: 'S3 Bucket for Resume Storage'
    Value: !Ref ResumeStorageBucket
    Export:
      Name: !Sub '${AWS::StackName}-ResumeBucket'

  LambdaFunctionArn:
    Description: 'Lambda Function ARN for Resume Processing'
    Value: !GetAtt ResumeProcessorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaFunctionName:
    Description: 'Lambda Function Name'
    Value: !Ref ResumeProcessorFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  ApiWebhookUrl:
    Description: 'Webhook URL for Lambda to call'
    Value: !Sub '${ApiBaseUrl}/api/AIAgent/webhook/resume-analyzed'
