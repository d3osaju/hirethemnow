AWSTemplateFormatVersion: '2010-09-09'
Description: 'HireThemNow AI Resume Analysis Infrastructure (Simplified - ATS Only)'

Parameters:
  DatabaseHost:
    Type: String
    Description: 'PostgreSQL Database Host'

  DatabasePassword:
    Type: String
    NoEcho: true
    Description: 'Database Password'

  ApiBaseUrl:
    Type: String
    Description: 'Base URL for your .NET API (e.g., https://api.hirethemnow.xyz)'

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID where Lambda and RDS are deployed'

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'Subnet IDs for Lambda (at least 2 in different AZs)'

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security Group ID of the RDS database to allow Lambda access'

Resources:
  # Security Group for Lambda Function
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-lambda-sg'
      GroupDescription: 'Security group for Lambda Resume Processor function'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'Allow all outbound traffic'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-sg'

  # Allow Lambda to access RDS
  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: 'Allow Lambda Resume Processor to access RDS'

  # IAM Role for Lambda Function
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-LambdaExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: LambdaS3BedrockPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource: !Sub 'arn:aws:s3:::${AWS::StackName}-resumes/*'
              - Effect: Allow
                Action:
                  - 'bedrock:InvokeModel'
                  - 'bedrock:InvokeModelWithResponseStream'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'textract:AnalyzeDocument'
                  - 'textract:DetectDocumentText'
                Resource: '*'

  # Lambda Function for Resume Processing
  ResumeProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ResumeProcessor'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          DATABASE_HOST: !Ref DatabaseHost
          DATABASE_PASSWORD: !Ref DatabasePassword
          API_BASE_URL: !Ref ApiBaseUrl
          RESUME_BUCKET: !Sub '${AWS::StackName}-resumes'
      Code:
        S3Bucket: !Sub '${AWS::StackName}-lambda-code'
        S3Key: 'resume-processor.zip'

  # Permission for S3 to invoke Lambda
  ResumeProcessorS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ResumeProcessorFunction
      Action: 'lambda:InvokeFunction'
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${AWS::StackName}-resumes'

  # S3 Bucket for Resume Storage
  ResumeStorageBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - ResumeProcessorFunction
      - ResumeProcessorS3Permission
    Properties:
      BucketName: !Sub '${AWS::StackName}-resumes'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ResumeProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .pdf
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ResumeProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .docx
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedHeaders:
              - '*'

Outputs:
  ResumeBucketName:
    Description: 'S3 Bucket for Resume Storage'
    Value: !Ref ResumeStorageBucket
    Export:
      Name: !Sub '${AWS::StackName}-ResumeBucket'

  LambdaFunctionArn:
    Description: 'Lambda Function ARN for Resume Processing'
    Value: !GetAtt ResumeProcessorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaFunctionName:
    Description: 'Lambda Function Name'
    Value: !Ref ResumeProcessorFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  ApiWebhookUrl:
    Description: 'Webhook URL for Lambda to call'
    Value: !Sub '${ApiBaseUrl}/api/AIAgent/webhook/resume-analyzed'
