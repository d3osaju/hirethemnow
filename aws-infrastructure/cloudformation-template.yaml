AWSTemplateFormatVersion: '2010-09-09'
Description: 'HireThemNow AI Resume Analysis Infrastructure (Simplified - ATS Only)'

Parameters:
  DatabaseHost:
    Type: String
    Description: 'PostgreSQL Database Host'

  DatabasePassword:
    Type: String
    NoEcho: true
    Description: 'Database Password'

  ApiBaseUrl:
    Type: String
    Description: 'Base URL for your .NET API (e.g., https://api.hirethemnow.xyz)'

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID where Lambda and RDS are deployed'

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'Subnet IDs for Lambda (at least 2 in different AZs)'

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security Group ID of the RDS database to allow Lambda access'

  # Commented out - only needed if creating NAT Gateway in template
  # PublicSubnetId:
  #   Type: AWS::EC2::Subnet::Id
  #   Description: 'Public subnet ID for NAT Gateway (must have Internet Gateway)'

  # RouteTableId:
  #   Type: String
  #   Description: 'Route table ID associated with Lambda subnets'

Resources:
  # NOTE: NAT Gateway, VPC Endpoints are already created manually
  # Uncomment these resources for fresh deployments
  # For existing deployments, these resources already exist and will cause conflicts

  # # Elastic IP for NAT Gateway
  # NatGatewayEIP:
  #   Type: AWS::EC2::EIP
  #   Properties:
  #     Domain: vpc
  #     Tags:
  #       - Key: Name
  #         Value: !Sub '${AWS::StackName}-nat-eip'

  # # NAT Gateway for Lambda internet access
  # NatGateway:
  #   Type: AWS::EC2::NatGateway
  #   Properties:
  #     AllocationId: !GetAtt NatGatewayEIP.AllocationId
  #     SubnetId: !Ref PublicSubnetId
  #     Tags:
  #       - Key: Name
  #         Value: !Sub '${AWS::StackName}-nat-gateway'

  # # Route to NAT Gateway
  # NatGatewayRoute:
  #   Type: AWS::EC2::Route
  #   DependsOn: NatGateway
  #   Properties:
  #     RouteTableId: !Ref RouteTableId
  #     DestinationCidrBlock: 0.0.0.0/0
  #     NatGatewayId: !Ref NatGateway

  # # S3 VPC Endpoint (Gateway - Free)
  # S3VpcEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
  #     VpcEndpointType: Gateway
  #     RouteTableIds:
  #       - !Ref RouteTableId

  # # Bedrock Runtime VPC Endpoint (Interface)
  # BedrockVpcEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-runtime'
  #     VpcEndpointType: Interface
  #     SubnetIds: !Ref SubnetIds
  #     SecurityGroupIds:
  #       - !Ref LambdaSecurityGroup
  #     PrivateDnsEnabled: true

  # Security Group for Lambda Function
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-lambda-sg'
      GroupDescription: 'Security group for Lambda Resume Processor function'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'Allow all outbound traffic'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-sg'

  # Allow Lambda to access RDS
  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: 'Allow Lambda Resume Processor to access RDS'

  # IAM Role for Lambda Function
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-LambdaExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: LambdaS3BedrockPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource: !Sub 'arn:aws:s3:::${AWS::StackName}-resumes/*'
              - Effect: Allow
                Action:
                  - 'bedrock:InvokeModel'
                  - 'bedrock:InvokeModelWithResponseStream'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'textract:AnalyzeDocument'
                  - 'textract:DetectDocumentText'
                Resource: '*'

  # Lambda Function for Resume Processing
  ResumeProcessorFunction:
    Type: AWS::Lambda::Function
    DependsOn: ResumeAnalysisAgentAlias
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ResumeProcessor'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          DATABASE_HOST: !Ref DatabaseHost
          DATABASE_PASSWORD: !Ref DatabasePassword
          API_BASE_URL: !Ref ApiBaseUrl
          RESUME_BUCKET: !Sub '${AWS::StackName}-resumes'
          AGENT_ID: !GetAtt ResumeAnalysisAgent.AgentId
          AGENT_ALIAS_ID: !GetAtt ResumeAnalysisAgentAlias.AgentAliasId
      Code:
        S3Bucket: !Sub '${AWS::StackName}-lambda-code'
        S3Key: 'resume-processor.zip'

  # Permission for S3 to invoke Lambda
  ResumeProcessorS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ResumeProcessorFunction
      Action: 'lambda:InvokeFunction'
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${AWS::StackName}-resumes'

  # S3 Bucket for Resume Storage
  ResumeStorageBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - ResumeProcessorFunction
      - ResumeProcessorS3Permission
    Properties:
      BucketName: !Sub '${AWS::StackName}-resumes'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ResumeProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .pdf
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ResumeProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .docx
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedHeaders:
              - '*'

  # IAM Role for ATS Analyzer Action Lambda
  ATSAnalyzerActionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ATSAnalyzerActionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'bedrock:InvokeModel'
                  - 'bedrock:InvokeModelWithResponseStream'
                Resource: '*'

  # Lambda Function for ATS Analyzer Action Group
  ATSAnalyzerActionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ATSAnalyzerAction'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt ATSAnalyzerActionRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          AWS_REGION: !Ref AWS::Region
      Code:
        S3Bucket: !Sub '${AWS::StackName}-lambda-code'
        S3Key: 'ats-analyzer-action.zip'

  # Permission for Bedrock Agent to invoke Action Lambda
  ATSAnalyzerActionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ATSAnalyzerActionFunction
      Action: 'lambda:InvokeFunction'
      Principal: bedrock.amazonaws.com
      SourceArn: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*'

  # IAM Role for Bedrock Agent
  BedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-BedrockAgentRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'bedrock:InvokeModel'
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0'
                  - 'arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0'
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                Resource: !GetAtt ATSAnalyzerActionFunction.Arn

  # Bedrock Agent for Resume Analysis
  ResumeAnalysisAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Sub '${AWS::StackName}-ResumeAnalysisAgent'
      AgentResourceRoleArn: !GetAtt BedrockAgentRole.Arn
      FoundationModel: 'amazon.nova-pro-v1:0'
      Instruction: |
        You are an expert resume analysis agent. Your role is to help analyze resumes for ATS (Applicant Tracking System) compatibility.

        When given a resume, you should:
        1. Use the analyzeResume action to get comprehensive ATS analysis
        2. Provide detailed insights about strengths and weaknesses
        3. Suggest specific, actionable improvements
        4. Explain scoring in clear terms

        Always be specific, actionable, and helpful in your responses.
      IdleSessionTTLInSeconds: 600
      AutoPrepare: true

  # Action Group for ATS Analysis
  ATSAnalyzerActionGroup:
    Type: AWS::Bedrock::AgentActionGroup
    Properties:
      ActionGroupName: ATSAnalyzer
      AgentId: !GetAtt ResumeAnalysisAgent.AgentId
      AgentVersion: DRAFT
      ActionGroupExecutor:
        Lambda: !GetAtt ATSAnalyzerActionFunction.Arn
      ApiSchema:
        Payload: |
          {
            "openapi": "3.0.0",
            "info": {
              "title": "ATS Resume Analyzer API",
              "version": "1.0.0",
              "description": "Action group for analyzing resumes with ATS scoring"
            },
            "paths": {
              "/analyze-resume": {
                "post": {
                  "summary": "Analyze a resume for ATS compatibility",
                  "description": "Analyzes resume text and provides comprehensive ATS scoring",
                  "operationId": "analyzeResume",
                  "requestBody": {
                    "required": true,
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "required": ["resumeText"],
                          "properties": {
                            "resumeText": {
                              "type": "string",
                              "description": "The full text content of the resume"
                            }
                          }
                        }
                      }
                    }
                  },
                  "responses": {
                    "200": {
                      "description": "Successful analysis",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }

  # Bedrock Agent Alias
  ResumeAnalysisAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    DependsOn: ATSAnalyzerActionGroup
    Properties:
      AgentId: !GetAtt ResumeAnalysisAgent.AgentId
      AgentAliasName: production
      Description: Production alias for Resume Analysis Agent

Outputs:
  ResumeBucketName:
    Description: 'S3 Bucket for Resume Storage'
    Value: !Ref ResumeStorageBucket
    Export:
      Name: !Sub '${AWS::StackName}-ResumeBucket'

  LambdaFunctionArn:
    Description: 'Lambda Function ARN for Resume Processing'
    Value: !GetAtt ResumeProcessorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaFunctionName:
    Description: 'Lambda Function Name'
    Value: !Ref ResumeProcessorFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  ApiWebhookUrl:
    Description: 'Webhook URL for Lambda to call'
    Value: !Sub '${ApiBaseUrl}/api/AIAgent/webhook/resume-analyzed'

  BedrockAgentId:
    Description: 'Bedrock Agent ID for Resume Analysis'
    Value: !GetAtt ResumeAnalysisAgent.AgentId
    Export:
      Name: !Sub '${AWS::StackName}-AgentId'

  BedrockAgentAliasId:
    Description: 'Bedrock Agent Alias ID'
    Value: !GetAtt ResumeAnalysisAgentAlias.AgentAliasId
    Export:
      Name: !Sub '${AWS::StackName}-AgentAliasId'

  ATSAnalyzerActionArn:
    Description: 'ATS Analyzer Action Lambda ARN'
    Value: !GetAtt ATSAnalyzerActionFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ATSActionArn'
